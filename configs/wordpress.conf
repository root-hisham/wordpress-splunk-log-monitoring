<VirtualHost *:80>
    ServerAdmin server@localhost
    ServerName 192.168.1.9
    DocumentRoot /var/www/html

    <Directory /var/www/html/wordpress>
        AllowOverride All
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
